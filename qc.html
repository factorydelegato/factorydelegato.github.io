<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>QUALITY CONTROL</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;background:#ffc800;font-family:Oswald,sans-serif;color:#000;display:flex;flex-direction:column;align-items:center;padding:40px 16px;box-sizing:border-box}
h1{font-weight:700;letter-spacing:.05em;margin:0 0 8px}p{margin:0 0 20px}
.g{display:grid;grid-template-columns:repeat(8,44px);gap:10px;margin-bottom:10px}
.g input{width:44px;height:44px;box-sizing:border-box;border:2px solid #000;background:#fff;text-align:center;font:700 20px Oswald;text-transform:lowercase}
#r1 input{border-width:4px}#ed{display:none;text-align:center;margin:10px 0 20px}#ed img{max-width:300px;display:block;margin:10px auto}
#rest{display:none}#ok{font-weight:700;margin-top:10px;min-height:1.4em}</style></head><body>
<h1>QUALITY CONTROL</h1><p>ENTER THE 8 CHARACTERS ON THE BACK</p>
<div class="g" id="r1"></div><div id="ed"></div><div id="rest"><p>ENTER THE FULL CODE</p><div class="g" id="r2"></div></div><div id="ok"></div>
<script>
// short code -> {edition, photo, h: sha256 of full code}. Full codes never published.
const REG={}};
const mk=(el,n)=>{for(let i=0;i<n;i++){const x=document.createElement('input');x.maxLength=1;el.appendChild(x)}return [...el.children]};
const a=mk(r1,8),b=mk(r2,56),all=a.concat(b);
all.forEach((x,i)=>{x.oninput=()=>{x.value=x.value.toLowerCase();if(x.value&&all[i+1]&&(i<7||rest.style.display))all[i+1].focus();chk()};
x.onkeydown=e=>{if(e.key=='Backspace'&&!x.value&&all[i-1])all[i-1].focus()};
x.onpaste=e=>{e.preventDefault();const t=(e.clipboardData.getData('text')||'').replace(/\s/g,'').toLowerCase();for(let j=0;j<t.length&&all[i+j];j++)all[i+j].value=t[j];chk();if(rest.style.display)chk()}});
const v=l=>l.map(x=>x.value).join('');
async function sha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function chk(){const s=v(a),e=REG[s];
if(s.length==8&&e){ed.style.display='block';ed.innerHTML='<b>EDITION '+e.ed+'</b>'+(e.img?'<img src="'+e.img+'">':'');rest.style.display='block';
const f=s+v(b);if(f.length==64)ok.textContent=(await sha(f))==e.h?'\u2713 VERIFIED':'\u2717';else ok.textContent=''}
else{ed.style.display=rest.style.display='none';ok.textContent=s.length==8?'NOT ON THE REGISTER.':''}}
</script></body></html>
